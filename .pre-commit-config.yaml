# Checks before each commit. Install the hook one time: pre-commit install
# The tests do not run here; see "Tests" in README.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two spaces at the end of a line are a line break in Markdown.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      # Connection strings in tests and examples can hold passwords.
      - id: detect-private-key

  - repo: local
    hooks:
      - id: zig-fmt
        name: zig fmt
        entry: zig fmt
        language: system
        files: \.(zig|zon)$
